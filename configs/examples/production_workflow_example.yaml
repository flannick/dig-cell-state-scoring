# Example config for the production multi-group workflow.
# Paths are illustrative; run from the analysis project root.

metadata: results/cell_state_de/metadata.tsv.gz
rank_10x_dir: results/cell_state_de/full_rank_10x
raw_10x_dir: results/cell_state_de/full_raw_10x
expression_matrix: results/cell_state_de/query_gene_expression_long.tsv.gz
states_gmt: cell_state_de/dat/pancreas/pancreas_cell_state_markers.gmt
state_manifest: results/cell_state_de/state_manifest.tsv
qc_gmt: cell_state_de/dat/qc/cmdkp_all_tissues_minimal_bad_cell_qc_signatures.gmt
phenotypes: results/cell_state_de/donor_phenotypes.tsv
phenotype_config: results/cell_state_de/phenotype_config.yaml
split_by: [tissue, cell_type]
out_dir: results/cell_state_de/production_run

jobs: 4
resume: true
skip_groups_without_gmt: true
allow_small_rank_universe: false
output_format: tsv
donor_expression_genes: query
write_donor_state_expression: true

scoring_extra_args:
  min_calibration_cells: 100
  min_markers_present: 5
  min_marker_coverage: 0.50

gmt_extra_args:
  top_n: 250
  min_weighted_mean_cp10k: 0.05
  min_weighted_pct_detected: 0.05
  min_log2fc: 0.25
  max_q_value: 0.05
  exclude_low_signal_states: true
  exclude_composite_required: true

pigean:
  pigean_command: ../.venv/bin/python
  pigean_command_template: >-
    env PYTHONPATH=/Users/flannick/codex-workspace/analysis/pigean_optimize/pigean/src
    {pigean} -m pigean betas
    --X-in {gmt}
    --multi-y-in {multi_y}
    --multi-y-id-col Gene
    --multi-y-pheno-col Trait_Internal
    --multi-y-log-bf-col Direct
    --multi-y-combined-col Combined
    --multi-y-prior-col Indirect
    --multi-y-trait-blacklist-in results/pigean_all_cell_states_full_universe_default_no_hpo_exomes/trait_blacklist_exomes_hp.txt
    --gene-universe-in ../resources/pigean/data/reference/NCBI37.3.plink.gene.loc
    --gene-universe-id-col 6
    --gene-universe-no-header
    --gene-set-stats-out {out}
    --params-out {out_dir}/params.out.gz
    --log-file {out_dir}/run.log
    --warnings-file {out_dir}/warnings.log
    --output-detail debug
    --deterministic
    --hide-progress
    --min-gene-set-size 1
    --filter-gene-set-p 1
    --max-gene-set-read-p 1
    --no-filter-negative
    --prune-gene-sets 1.1
    --weighted-prune-gene-sets 1.1
    {extra_args}
  multi_y_input: ../resources/pigean/data/large/all.gene_stats.large.gt1.out.gz
  methods: [original_markers, top_absolute_expression, top_specific_fc, top_specific_logp]
  extra_args: ""
  dry_run: false
